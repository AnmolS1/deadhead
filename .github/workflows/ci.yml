name: ci

on:
  pull_request:
  # `dev` is deliberately not listed. Work lands on `dev` and reaches `prod` by
  # PR, so a push trigger on `dev` would run the same commit twice.
  push:
    branches: [prod]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Guards against the lockfile drifting from the workspace set. It is also
      # checked locally by check:all, because npm ci is the only thing that
      # notices otherwise — and by then it is a red PR.
      - name: lockfile
        run: npm run check:lockfile

      - name: format
        run: npm run format:check

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      # S-02. Runs after typecheck because it scans dist/, and it self-tests by
      # feeding ESLint deliberate violations. If this is ever green while the
      # sim is impure, multiplayer and leaderboards are both silently wrong.
      - name: sim purity
        run: npm run lint:sim-purity

      - name: test
        run: npm test

      # The other half of determinism: the same suite again inside workerd, the
      # runtime the Durable Object and the replay validator actually use. The
      # goldens passing in both engines is what says multiplayer and
      # leaderboards are buildable (S-06, S-14).
      - name: test (workerd)
        run: npm run test:workerd
