<!doctype html>
<meta charset="utf-8" />
<title>Creaseway</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<style>
  /*
   * Chrome outside the canvas, in ponderance's tokens.
   *
   * `design-system.sh` requires `var(--color-*)` / `var(--font-*)` for game UI
   * chrome, and the tokens are declared here with the site's own values as
   * fallbacks so the page is correct standalone in dev and inherits the site's
   * when `P-01` mounts it at /play/deadhead. The moment it is mounted, the
   * fallbacks stop being used and the site becomes the single source.
   *
   * There is almost nothing here on purpose. The game is the canvas; the page
   * is a surface to put it on, and the surface is the same sheet of paper the
   * city is folded from.
   */
  :root {
    --color-graph: #eef0ec;
    --color-graphite: #1b2a33;
    --font-ui: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  html,
  body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--color-graph);
    color: var(--color-graphite);
    font-family: var(--font-ui);
    /* The sheet does not bounce. */
    overscroll-behavior: none;
  }

  #game {
    display: block;
    width: 100%;
    height: 100%;
    /* A canvas is a graphic, not a document: never select or long-press it. */
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }

  /* Visible focus, because the canvas is the only interactive thing here. */
  #game:focus-visible {
    outline: 2px solid var(--color-graphite);
    outline-offset: -2px;
  }
</style>
<canvas id="game" tabindex="0" aria-label="Creaseway — a folded paper city"></canvas>
<!-- External module, never inline: the site ships script-src 'self'. See CLAUDE.md §4. -->
<script type="module" src="/src/main.ts"></script>
